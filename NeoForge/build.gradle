plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}
base.archivesName = 'TerraBlender-neoforge-1.21.1-zublastic-passive'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
sourceSets {
    main {
        java.srcDir('../Common/src/main/java')
        resources.srcDir('../Common/src/main/resources')
    }
    test { java.srcDir('../tests/java') }
}
neoForge {
    version = '21.1.248'
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    mods { terrablender { sourceSet(sourceSets.main) } }
    unitTest {
        enable()
        testedMod = mods.terrablender
    }
    runs {
        server { server(); programArgument('--nogui') }
    }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Optional isolated compatibility fixture; never include these jars in the product.
    if (providers.gradleProperty('compatModsDir').isPresent()) {
        runtimeOnly fileTree(dir: providers.gradleProperty('compatModsDir').get(), include: ['*.jar'])
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '512m'
    systemProperty 'expectedCompatModIds', providers.gradleProperty('expectedCompatModIds').getOrElse('')
    systemProperty 'expectModernFixSurface', providers.gradleProperty('expectModernFixSurface').getOrElse('false')
}
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes('Implementation-Version': project.version,
            'Zublastic-Variant': 'passive',
            'Upstream-Commit': 'c90344362b5e813c43f38fed19ea82412c1fffc3')
    from(rootProject.file('LICENSE'))
}
